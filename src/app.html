<!doctype html>
<!-- The OG prefixes the venue head uses: og: for the base tags, plus the place:
     and restaurant: verticals for a venue's og:type restaurant.restaurant and its
     place:location:* coordinates (issue #224). -->
<!-- %lang% and %textdir% are stamped by the localize hook (hooks.server.ts):
     dir="rtl" for the right-to-left locales (ur, fa) so their text runs
     correctly, ltr otherwise. -->
<html
	lang="%lang%"
	dir="%textdir%"
	prefix="og: https://ogp.me/ns# place: https://ogp.me/ns/place# restaurant: https://ogp.me/ns/restaurant#"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
