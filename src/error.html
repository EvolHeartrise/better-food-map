<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>%sveltekit.status% · BetterFoodMaps</title>
		<!-- Static fallback error page, served when the app itself can't render
		     (errors in hooks or +server.ts handlers, e.g. OAuth callback 400s).
		     app.css isn't available here, so it inlines the same tokens and glass
		     card the app's +error.svelte uses. -->
		<style>
			:root {
				--color-bg: #f7f7f8;
				--color-text: #1a1a1a;
				--color-text-muted: #5c5c66;
				--color-accent: #2f6f4f;
				--color-accent-hover: #245a40;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1rem;
				background:
					radial-gradient(60rem 40rem at 50% -10%, rgba(47, 111, 79, 0.14), transparent 70%),
					var(--color-bg);
				color: var(--color-text);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif,
					'Apple Color Emoji',
					'Segoe UI Emoji';
				font-size: 16px;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}

			.card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.4rem;
				width: min(24rem, 100%);
				padding: 2.25rem 2rem;
				text-align: center;
				border-radius: 0.9rem;
				background: rgba(255, 255, 255, 0.92);
				backdrop-filter: blur(16px) saturate(180%);
				-webkit-backdrop-filter: blur(16px) saturate(180%);
				border: 1px solid rgba(255, 255, 255, 0.6);
				box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
			}

			.brand {
				margin: 0;
				font-size: 0.8rem;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--color-accent);
			}

			.status {
				margin: 0;
				font-size: 3.5rem;
				font-weight: 700;
				line-height: 1;
				font-variant-numeric: tabular-nums;
			}

			.message {
				margin: 0;
				font-size: 1rem;
				font-weight: 500;
				line-height: 1.2;
				color: var(--color-text-muted);
			}

			.link {
				display: inline-block;
				margin-top: 1rem;
				padding: 0.5rem 1.1rem;
				font-size: 0.9rem;
				font-weight: 600;
				color: #fff;
				text-decoration: none;
				background: var(--color-accent);
				border: 1px solid var(--color-accent);
				border-radius: 999px;
				transition: background-color 0.12s;
			}

			.link:hover {
				background: var(--color-accent-hover);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<p class="brand">BetterFoodMaps</p>
			<p class="status">%sveltekit.status%</p>
			<h1 class="message">%sveltekit.error.message%</h1>
			<a class="link" href="/">Back to the map</a>
		</div>
	</body>
</html>
